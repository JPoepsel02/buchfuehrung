appId: de.kljb-herzfeld.buchfuehrung
productName: Buchführung
# Umlaut-freie Dateinamen für die Installer-Artefakte
artifactName: Buchfuehrung-${version}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
mac:
  category: public.app-category.finance
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  language: '1031'
publish: null
