appId: de.kljb-herzfeld.buchfuehrung
# ASCII-Paketname: ein Umlaut im Bundle-/Executable-Namen lässt Electron
# auf macOS beim Start abstürzen (Helper-Pfade, NFC/NFD-Problem).
# Der sichtbare Name „Buchführung“ kommt über CFBundleDisplayName.
productName: Buchfuehrung
artifactName: Buchfuehrung-${version}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
mac:
  category: public.app-category.finance
  extendInfo:
    CFBundleDisplayName: Buchführung
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  language: '1031'
publish: null
